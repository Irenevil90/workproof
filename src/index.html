// ── NAVIGATION ────────────────────────────────────────────────────────────

function goLanding() {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById('screen-landing').classList.add('active');
  updateLandingWallet();
}

function goAdmin() {
  if (!walletPubkey) {
    connectPhantom().then(pk => { if (pk) goAdmin(); });
    return;
  }
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById('screen-setup').classList.add('active');
  nextStep(1);
}

function goCompetitor() {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById('screen-competitor').classList.add('active');

  if (compJoined && compChallenge) {
    showCompDashboard();
  } else {
    document.getElementById('comp-browser').style.display = 'block';
    document.getElementById('comp-dashboard').style.display = 'none';
    buildChallengeList();
  }
  updateCompWalletUI();
}

function updateLandingWallet() {
  const lbl = document.getElementById('landing-wallet-label');
  if (!lbl) return;
  if (walletPubkey) {
    lbl.textContent = '👻 ' + walletPubkey.toString().slice(0,8) + '... connected ✓';
  } else {
    lbl.textContent = 'Connect Phantom to continue';
  }
}

async function handleConnectFromLanding() {
  if (walletPubkey) {
    // already connected — do nothing
    updateLandingWallet();
    return;
  }
  await connectPhantom();
  updateLandingWallet();
}

function previewChallenge(pda) {
  const ch = MOCK_CHALLENGES.find(c => c.pda === pda);

  showToast('ℹ️', ch.name, ch.company + ' · ' + ch.reward + ' · ' + ch.daysLeft + ' days left');
}

// ── JOIN CHALLENGE ─────────────────────────────────────────────────────────

async function joinChallenge(pda) {
  if (!walletPubkey) {
    showToast('⚠️','Connect Phantom first','');
    await connectPhantom();
    if (!walletPubkey) return;
  }

  const ch = MOCK_CHALLENGES.find(c => c.pda === pda);
  if (!ch) return;

  // Show profile registration modal
  document.getElementById('profile-modal').style.display = 'flex';
  document.getElementById('profile-modal').dataset.pda = pda;
}

async function confirmRegister() {
  const firstname = document.getElementById('reg-firstname')?.value?.trim() || '';
  const lastname  = document.getElementById('reg-lastname')?.value?.trim()  || '';
  const pda       = document.getElementById('profile-modal').dataset.pda;

  if (!firstname) {
    document.getElementById('reg-firstname').style.borderColor = 'var(--accent3)';
    return;
  }

  document.getElementById('profile-modal').style.display = 'none';

  // Save profile
  compProfile = { firstname, lastname, displayName: firstname + (lastname ? ' ' + lastname : '') };
  sessionStorage.setItem('comp_profile', JSON.stringify(compProfile));

  // Register on-chain
  showToast('⏳','Registering on-chain…','Sign in Phantom');
  sessionStorage.setItem('challengePDA', pda);

  const result = await txRegisterParticipant();
  if (!result && walletPubkey) {
    // If already registered, proceed anyway
    showToast('ℹ️','Already registered','Loading your dashboard…');
  }

  // Mark as joined
  const ch = MOCK_CHALLENGES.find(c => c.pda === pda);
  compChallenge = ch;
  compJoined    = true;
  sessionStorage.setItem('comp_joined', 'true');
  sessionStorage.setItem('comp_challenge', JSON.stringify(ch));

  showCompDashboard();
  showToast('✅', 'Welcome ' + compProfile.displayName + '!', 'You're in the challenge. Good luck 🚀');
}

// ── COMPETITOR DASHBOARD ──────────────────────────────────────────────────

function showCompDashboard() {
  document.getElementById('comp-browser').style.display   = 'none';
  document.getElementById('comp-dashboard').style.display = 'flex';

  const ch = compChallenge || MOCK_CHALLENGES[0];
  document.getElementById('comp-challenge-name').textContent = ch?.name || '—';
  document.getElementById('comp-stat-participants').textContent = ch?.participants || '—';
  document.getElementById('comp-stat-reward').textContent = ch?.reward || '—';

  // My rank — find self in participants or show last+1
  const myName = compProfile?.displayName || 'You';
  const myRank = 3; // demo
  document.getElementById('comp-my-rank').textContent = '#' + myRank;

  buildCompLeaderboard();
  buildCompVoteCards();
  updatePowDisplay();
  updateCompProfilePage();
  startCompTimer();
}

function showCompPage(name, navEl) {
  document.querySelectorAll('#comp-dashboard .page').forEach(p => p.classList.remove('active'));
  document.getElementById('comp-page-' + name).classList.add('active');
  document.querySelectorAll('.comp-sidebar .nav-item').forEach(n => n.classList.remove('active'));
  if (navEl) navEl.classList.add('active');

  if (name === 'pow') updatePowDisplay();
  if (name === 'profile') updateCompProfilePage();
}

// ── LEADERBOARD ───────────────────────────────────────────────────────────

function buildCompLeaderboard() {
  const ch      = compChallenge || MOCK_CHALLENGES[0];
  const splits  = {1:[100],3:[50,30,20],5:[40,25,15,10,10]};
  const pcts    = splits[ch?.topN||3] || splits[3];
  const totalRewardNum = parseInt((ch?.reward||'1000').replace(/[^0-9]/g,'')) || 1000;
  const medals  = ['🥇','🥈','🥉'];
  const colors  = ['rank-1','rank-2','rank-3'];
  const BG      = ['#7c5cfc','#00e5b0','#ff6b4a','#ffc84a','#e05ccf','#4a9eff','#ff5b8a','#5be0cc'];

  // Insert "me" at position based on score
  const myName = compProfile?.displayName || 'You';
  const myScore = parseInt(sessionStorage.getItem('today_computed_score') || '0') * 3 + 150;
  const myWalletShort = walletPubkey
    ? walletPubkey.toString().slice(0,4)+'...'+walletPubkey.toString().slice(-4)
    : 'My wallet';

  const allParticipants = [
    ...COMP_PARTICIPANTS,
    { addr: myWalletShort, name: myName + ' (you)', role: 'You', score: myScore, consensus: 85, streak: 2, isMe: true },
  ].sort((a,b) => b.score - a.score);

  let html = '';
  allParticipants.forEach((p, i) => {
    const rank = i + 1;
    const rewardAmt = rank <= pcts.length ? Math.round(totalRewardNum * pcts[rank-1] / 100) : 0;
    const rewardStr = rewardAmt > 0
      ? `<span style="color:var(--gold);font-family:var(--font-mono);font-size:12px">${rewardAmt.toLocaleString()} ${ch?.token||'USDC'}</span>`
      : '<span style="color:var(--muted);font-size:12px">—</span>';
    const consColor = p.consensus >= 90 ? 'var(--accent2)' : p.consensus >= 75 ? 'var(--accent)' : 'var(--accent3)';
    const rowBg = p.isMe ? 'background:rgba(0,229,176,0.04);border-left:2px solid var(--accent2);' : '';
    html += `
    <div style="display:grid;grid-template-columns:40px 1fr 80px 80px 80px 100px;align-items:center;padding:14px 24px;border-bottom:1px solid var(--border);${rowBg}">
      <div style="font-family:var(--font-mono);font-size:13px;font-weight:700" class="${colors[i]||''}">${medals[i]||rank}</div>
      <div style="display:flex;align-items:center;gap:10px">
        <div style="width:32px;height:32px;border-radius:8px;background:${BG[i%BG.length]}22;color:${BG[i%BG.length]};display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12px">${p.name.slice(0,1)}</div>
        <div>
          <div style="font-size:13px;font-weight:600">${p.name}</div>
          <div style="font-size:10px;color:var(--muted);font-family:var(--font-mono)">${p.addr}</div>
        </div>
      </div>
      <div style="font-family:var(--font-mono);font-size:14px;font-weight:700;text-align:right;${i<3?'color:var(--accent2)':''}">${p.score.toLocaleString()}</div>
      <div style="text-align:right">
        <div style="font-family:var(--font-mono);font-size:12px;color:${consColor}">${p.consensus}%</div>
        <div style="height:3px;background:var(--border2);border-radius:2px;margin-top:3px;overflow:hidden"><div style="height:100%;width:${p.consensus}%;background:${consColor}"></div></div>
      </div>
      <div style="font-family:var(--font-mono);font-size:12px;text-align:center;color:${p.streak>=7?'var(--gold)':p.streak>=5?'var(--accent2)':'var(--muted)'}">${p.streak>=7?'🔥':''}${p.streak}d</div>
      <div style="text-align:right">${rewardStr}</div>
    </div>`;
  });

  const el = document.getElementById('comp-lb-body');
  if (el) el.innerHTML = html;
}

// ── VOTE CARDS (competitor view) ──────────────────────────────────────────

function buildCompVoteCards() {
  const myWalletShort = walletPubkey
    ? walletPubkey.toString().slice(0,4)+'...'+walletPubkey.toString().slice(-4)
    : null;

  // Only show colleagues (not self)
  const toVote = COMP_PARTICIPANTS.filter(p =>
    !myWalletShort || !p.addr.startsWith(myWalletShort.slice(0,4))
  );

  const pending = toVote.filter(p => !sessionStorage.getItem('voted_' + p.addr));
  const el = document.getElementById('comp-vote-count');
  if (el) el.textContent = pending.length + ' pending';
  const badge = document.getElementById('comp-vote-badge');
  if (badge) badge.textContent = pending.length;

  let html = '';
  toVote.forEach(p => {
    const alreadyVoted = sessionStorage.getItem('voted_' + p.addr);
    if (alreadyVoted) {
      html += `
      <div class="vote-card" id="cv-${p.addr}">
        <div class="vote-card-header">
          <div style="display:flex;align-items:center;gap:10px">
            <div style="width:36px;height:36px;border-radius:8px;background:rgba(124,92,252,0.15);display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:700;color:var(--accent)">${p.name.slice(0,1)}</div>
            <div><div style="font-size:14px;font-weight:700">${p.name}</div><div style="font-size:11px;color:var(--muted)">${p.role} · ${p.addr}</div></div>
          </div>
        </div>
        <div class="voted-badge">${alreadyVoted === 'yes' ? '✅ Voted — good day' : alreadyVoted === 'no' ? '❌ Voted — not really' : '⏭️ Skipped'} <span style="font-family:var(--font-mono);font-size:10px;color:var(--muted)">committed on-chain</span></div>
      </div>`;
    } else {
      html += `
      <div class="vote-card" id="cv-${p.addr}">
        <div class="vote-card-header">
          <div style="display:flex;align-items:center;gap:10px">
            <div style="width:36px;height:36px;border-radius:8px;background:rgba(124,92,252,0.15);display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:700;color:var(--accent)">${p.name.slice(0,1)}</div>
            <div>
              <div style="font-size:14px;font-weight:700">${p.name}</div>
              <div style="font-size:11px;color:var(--muted)">${p.role} · <span style="font-family:var(--font-mono)">${p.addr}</span></div>
            </div>
          </div>
          <div style="font-family:var(--font-mono);font-size:10px;color:var(--muted);text-align:right">your vote<br>is anonymous</div>
        </div>
        <div class="activity-chips" style="margin:12px 0">
          <div class="chip">💬 Messages <span class="chip-val">${Math.round(Math.random()*30+10)}</span></div>
          <div class="chip">📅 Meetings <span class="chip-val">${Math.round(Math.random()*4+1)}</span></div>
          <div class="chip">📄 Docs <span class="chip-val">${Math.round(Math.random()*6+1)}</span></div>
          <div class="chip">📧 Emails <span class="chip-val">${Math.round(Math.random()*15+5)}</span></div>
        </div>
        <p style="font-size:13px;color:var(--muted);margin-bottom:14px">Was <strong style="color:var(--text)">${p.name}</strong> productive today? Your vote is wallet-signed and commit-revealed — no one can see who voted what.</p>
        <div class="vote-actions">
          <button class="vote-btn yes" onclick="castCompVote('${p.addr}','yes')">👍 Yes, good day</button>
          <button class="vote-btn no"  onclick="castCompVote('${p.addr}','no')">👎 Not really</button>
          <button class="vote-btn skip" onclick="castCompVote('${p.addr}','skip')">⏭ Skip</button>
        </div>
      </div>`;
    }
  });

  const cards = document.getElementById('comp-vote-cards');
  if (cards) cards.innerHTML = html || '<div style="color:var(--muted);text-align:center;padding:32px">All votes cast for today ✓</div>';
}

async function castCompVote(addr, verdict) {
  const card = document.getElementById('cv-' + addr);

  if (verdict === 'skip') {
    sessionStorage.setItem('voted_' + addr, 'skip');
    buildCompVoteCards();
    return;
  }

  card.innerHTML = card.innerHTML.replace('</div>', '') + '<div class="voted-badge">⏳ Signing in Phantom…</div>';

  // Real on-chain vote if we have a commitPDA
  const commitPDA = sessionStorage.getItem('commitPDA_' + addr);
  if (walletPubkey && commitPDA && typeof txCastVote === 'function') {
    const sig = await txCastVote(commitPDA, verdict === 'yes');
    if (sig) {
      sessionStorage.setItem('voted_' + addr, verdict);
      buildCompVoteCards();
      return;
    }
  }

  // Simulated (no commitPDA yet)
  sessionStorage.setItem('voted_' + addr, verdict);
  showToast('🗳️','Vote recorded','Commit-reveal hash will be submitted on-chain');
  buildCompVoteCards();
}

// ── PROOF OF WORK ──────────────────────────────────────────────────────────

function updatePowDisplay() {
  const score = sessionStorage.getItem('today_computed_score');
  const el    = document.getElementById('pow-score-display');
  if (el) el.textContent = score ? parseInt(score) + ' pts' : '— pts';

  // Activity summary chips
  const activity = JSON.parse(sessionStorage.getItem('today_activity') || '{}');
  const chips = document.getElementById('pow-activity-summary');
  if (chips && Object.keys(activity).length) {
    chips.innerHTML = [
      activity.meetings    != null ? `<div class="chip">📅 ${activity.meetings} meetings</div>` : '',
      activity.totalEvents != null ? `<div class="chip">📆 ${activity.totalEvents} events</div>` : '',
      activity.commits     != null ? `<div class="chip">🐙 ${activity.commits} commits</div>` : '',
      activity.prs         != null ? `<div class="chip">🔀 ${activity.prs} PRs</div>` : '',
      activity.source      ? `<div class="chip" style="color:var(--accent2)">✓ ${activity.source}</div>` : '',
    ].filter(Boolean).join('');
  }

  // History
  const hist = document.getElementById('pow-history');
  if (hist) {
    if (!powHistory.length) {
      hist.innerHTML = '<div style="color:var(--muted);font-size:13px">No commits yet — submit your first proof of work above.</div>';
    } else {
      hist.innerHTML = powHistory.map(h => `
        <div class="chain-row">
          <div class="chain-label">Day ${h.day} · ${h.score} pts · <span style="font-size:10px;color:var(--muted)">${h.source||'manual'}</span></div>
          <div class="chain-val" style="font-size:11px;color:var(--accent2)">tx: ${h.sig ? h.sig.slice(0,8)+'…' : 'pending'}</div>
        </div>`).join('');
    }
  }

  // Calendar chips in POW page
  const calChips = document.getElementById('pow-gcal-chips');
  if (calChips && activity.meetings != null) {
    calChips.innerHTML = `<div class="chip">📅 ${activity.meetings} meetings</div><div class="chip">📆 ${activity.totalEvents||0} events</div>`;
  }
}

async function submitPow() {
  if (!walletPubkey) { showToast('⚠️','Connect Phantom first',''); return; }

  const score  = parseInt(sessionStorage.getItem('today_computed_score') || '0') || Math.round(80 + Math.random()*80);
  const day    = powHistory.length; // next day to commit
  document.getElementById('pow-day-num').textContent = day;

  const result = await txCommitDailyScore(score, day);
  const sig    = result?.sig || null;

  // Record in history
  const activity = JSON.parse(sessionStorage.getItem('today_activity') || '{}');
  powHistory.push({
    day,
    score,
    sig,
    source: activity.source || 'manual',
    ts:     new Date().toISOString(),
  });
  sessionStorage.setItem('pow_history', JSON.stringify(powHistory));

  updatePowDisplay();
  updateCompProfilePage();
  showToast('⛓️', 'Proof of work submitted!', 'Day ' + day + ' · ' + score + ' pts on-chain');
}

function connectGithubPow() {
  const input = document.getElementById('pow-github-input');
  const username = input?.value?.trim() || sessionStorage.getItem('github_username');
  if (!username) { showToast('⚠️','Enter GitHub username',''); return; }
  sessionStorage.setItem('github_username', username);
  if (typeof fetchGithubActivity === 'function') {
    fetchGithubActivity(username).then(() => updatePowDisplay());
  }
}

function updateCompProfilePage() {
  const name    = compProfile?.displayName || 'Anonymous';
  const wallet  = walletPubkey?.toString() || '—';
  const short   = wallet !== '—' ? wallet.slice(0,8)+'...' : '—';

  document.getElementById('comp-display-name').textContent  = name;
  document.getElementById('comp-wallet-display').textContent = short;
  document.getElementById('comp-onchain-wallet').textContent = short;
  document.getElementById('comp-days-committed').textContent = powHistory.length;
  document.getElementById('comp-validations').textContent    = powHistory.length * 3; // estimate
  document.getElementById('comp-challenge-pda').textContent  = compChallenge?.pda?.slice(0,12)+'...' || '—';
  document.getElementById('comp-avatar').textContent = name.slice(0,1).toUpperCase();

  const proofLink = wallet !== '—' ? 'workproof.xyz/proof/' + wallet.slice(0,8) : '—';
  document.getElementById('comp-proof-link').textContent = proofLink;

  if (compProfile) {
    const fn = document.getElementById('profile-firstname');
    const ln = document.getElementById('profile-lastname');
    if (fn) fn.value = compProfile.firstname || '';
    if (ln) ln.value = compProfile.lastname  || '';
  }
}

function saveProfile() {
  const fn = document.getElementById('profile-firstname')?.value?.trim() || '';
  const ln = document.getElementById('profile-lastname')?.value?.trim()  || '';
  if (!fn) return;
  compProfile = { firstname:fn, lastname:ln, displayName: fn + (ln?' '+ln:'') };
  sessionStorage.setItem('comp_profile', JSON.stringify(compProfile));
  showToast('✅','Profile saved', compProfile.displayName);
  updateCompProfilePage();
  buildCompLeaderboard();
  buildCompVoteCards();
}

function copyProofLink() {
  const wallet = walletPubkey?.toString() || '';
  const link   = 'https://workproof.xyz/proof/' + wallet.slice(0,8);
  navigator.clipboard?.writeText(link);
  showToast('📋','Link copied!', link);
}

// ── LEAVE CHALLENGE ───────────────────────────────────────────────────────

async function leaveChallenge() {
  if (!confirm('Leave this challenge? Your on-chain score history will be preserved.')) return;
  compJoined   = false;
  compChallenge = null;
  sessionStorage.removeItem('comp_joined');
  sessionStorage.removeItem('comp_challenge');
  sessionStorage.removeItem('challengePDA');
  sessionStorage.removeItem('participantPDA');
  showToast('👋','Left challenge','Your score history is preserved on-chain');
  goCompetitor(); // back to browser
}

// ── COMPETITOR WALLET UI ───────────────────────────────────────────────────

function updateCompWalletUI() {
  const btn = document.getElementById('comp-wallet-btn');
  const dot = document.getElementById('comp-chain-dot');
  const lbl = document.getElementById('comp-chain-label');
  if (walletPubkey) {
    if (btn) { btn.textContent = '👻 '+walletPubkey.toString().slice(0,4)+'…'+walletPubkey.toString().slice(-4); btn.style.color='var(--accent2)'; }
    if (dot) { dot.style.background='var(--accent2)'; dot.style.boxShadow='0 0 8px var(--accent2)'; }
    if (lbl) lbl.textContent = 'Devnet live';
    // update comp wallet status in browser view
    const st = document.getElementById('comp-wallet-status');
    if (st) st.textContent = 'Connected: ' + walletPubkey.toString().slice(0,8) + '...';
  } else {
    if (btn) { btn.textContent = '👻 Connect Phantom'; btn.style.color = ''; }
    if (dot) dot.style.background = 'var(--muted)';
    if (lbl) lbl.textContent = 'Disconnected';
  }
}

function handleCompWalletBtn() {
  if (walletPubkey) disconnectPhantom().then(() => updateCompWalletUI());
  else connectPhantom().then(() => updateCompWalletUI());
}

// ── TIMER ─────────────────────────────────────────────────────────────────

let _compTimerInterval = null;
function startCompTimer() {
  if (_compTimerInterval) clearInterval(_compTimerInterval);
  const ch = compChallenge || MOCK_CHALLENGES[0];
  let remaining = (ch?.daysLeft || 23) * 86400 + 14 * 3600;

  const update = () => {
    remaining = Math.max(0, remaining - 1);
    const d   = Math.floor(remaining / 86400);
    const h   = Math.floor((remaining % 86400) / 3600);
    const el  = document.getElementById('comp-timer');
    if (el) el.textContent = d + 'd ' + h + 'h';
    const pct = 100 - Math.round((remaining / ((ch?.totalDays||30) * 86400)) * 100);
    const pb  = document.getElementById('comp-progress');
    if (pb) pb.style.width = pct + '%';
  };
  update();
  _compTimerInterval = setInterval(update, 1000);
}
